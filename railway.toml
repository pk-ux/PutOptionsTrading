# Railway configuration for multi-service deployment
# - Portions generated by AI

[build]
builder = "DOCKERFILE"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# =============================================================================
# Breakout Scanner - scheduled scan (optional)
# =============================================================================
# This file configures the long-running web service. Railway runs a cron job as a
# SEPARATE service (a service can be either a web service OR a cron job, not both),
# so the schedule below cannot live in this same [deploy] block.
#
# To enable the daily Momentum Stocks refresh, create a second service from this
# same repo/image and set, in that service's settings:
#
#   Start command:  python -m scripts.run_breakout_scan
#   Cron schedule:  30 21 * * 1-5   (UTC; ~4:30pm ET on US trading days)
#
# Give it the same variables as the web service (DATABASE_URL,
# UNUSUAL_WHALES_API_KEY, etc.). See MIGRATION.md -> "Breakout Scanner".
